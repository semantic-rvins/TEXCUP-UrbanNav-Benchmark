# GICI offline post-processing RTK (GNSS only) on TEX-CUP.
# Adapted from upstream option/post_estimation_RTK_RRR_rinex_imutext.yaml (streamer layout)
# and option/pseudo_real_time_estimation_RTK.yaml (rtk estimator options, kept at defaults).
# Paths below are repository-relative templates; the run supervisor resolves
# the actual input/output paths for each isolated run.
stream:
  streamers:
  - streamer:
      tag: str_gnss_rov_file
      type: post-file
      path: projects/GICI-LIB/data_converted/rover_cut.obs
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_ref_file
      type: post-file
      path: projects/GICI-LIB/data_converted/base_cut.obs
      format:
        type: gnss-rinex
  - streamer:
      tag: str_gnss_eph_file
      type: post-file
      path: data/tex_cup/brdm1290.19p
      burst_load: true
      format:
        type: gnss-rinex
  - streamer:
      tag: str_rtk_solution_file
      input_tags: [fmt_rtk_solution_file]
      type: file
      path: results/GICI-RTK/run/solution.nmea
      enable_time_tag: false

  formators:
  - formator:
      io: output
      tag: fmt_rtk_solution_file
      type: nmea
      use_gga: true
      use_rmc: false
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: true
    start_offset: 0.0

estimate:
- estimator:
    tag: est_rtk
    type: rtk
    input_tags: [str_gnss_rov_file, str_gnss_ref_file, str_gnss_eph_file]
    str_gnss_rov_file_roles: [rover]
    str_gnss_ref_file_roles: [reference]
    str_gnss_eph_file_roles: [ephemeris]
    output_tags: [fmt_rtk_solution_file]
    output_align_tag: str_gnss_rov_file
    compute_covariance: true
    rtk_options:
      max_window_length: 3
      use_ambiguity_resolution: true
      estimate_velocity: true
    gnss_estimator_base_options:
      gnss_common:
        # Current benchmark: GPS/Galileo/BeiDou measurements; GLONASS disabled.
        # The canonical reduced RINEX already omits GPS 2L and Galileo 5Q.
        system_exclude: [R]
        code_exclude: [G|2L, E|5Q]
        min_elevation: 12.0
        min_SNR: [35.0, 30.0]
        mw_slip_thres: 0.5
        gf_slip_thres: 0.05
        gf_sd_slip_thres: 0.05
      use_outlier_rejection: true
      max_pesudorange_error: 4.0
      max_phaserange_error: 0.06
      max_doppler_error: 0.5
    estimator_base_options:
      max_iteration: 5
      num_threads: 2
      max_solver_time: 0.02
      verbose_output: false
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 2.0

logging:
  enable: true
  min_log_level: 0
  log_to_stderr: true
  file_directory: results/GICI-RTK/run/log
